<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartão de Campo · Controle de Desenhos</title>
<script src="store.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #0d1b2a; color: #e0e6f0; min-height: 100vh; }

  header {
    background: linear-gradient(135deg, #0a1628 0%, #1a3a5c 100%);
    border-bottom: 2px solid #1e5fa8;
    padding: 18px 32px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
  }
  .logo { display: flex; align-items: center; gap: 14px; }
  .logo-icon { width: 44px; height: 44px; background: #1e5fa8; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .logo-text h1 { font-size: 18px; font-weight: 700; color: #fff; }
  .logo-text p { font-size: 12px; color: #7aa3cc; }
  .nav-links { display: flex; gap: 10px; flex-wrap: wrap; }
  .nav-link {
    color: #7aa3cc; font-size: 13px; text-decoration: none;
    border: 1px solid #1e4a7a; padding: 8px 14px; border-radius: 8px;
    transition: all 0.2s;
  }
  .nav-link:hover { color: #e0e6f0; border-color: #3a8fd4; }

  .wrap { max-width: 1280px; margin: 0 auto; padding: 24px 28px; }

  .doc-card {
    background: #0f2240; border: 1px solid #1e4a7a; border-radius: 12px;
    padding: 18px 22px; margin-bottom: 20px;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px 24px;
  }
  .doc-card div span.l { display: block; font-size: 11px; color: #7aa3cc; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
  .doc-card div span.v { font-size: 14px; color: #e0e6f0; font-weight: 600; }
  .doc-card div span.v.mono { font-family: 'Courier New', monospace; }

  .hold-banner {
    background: #2a1a00; border: 1px solid #5a3800; color: #f0a030;
    border-radius: 10px; padding: 12px 16px; font-size: 13px;
    margin-bottom: 20px; display: flex; gap: 10px; align-items: flex-start;
  }
  .hold-banner b { color: #fff; }

  .map-panel {
    background: #0f2240; border: 1px solid #1e4a7a; border-radius: 12px;
    padding: 16px 18px; margin-bottom: 20px;
  }
  .map-title { font-size: 13px; color: #7aa3cc; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; font-weight: 600; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; font-size: 12px; color: #c8d8ec; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  .strip { display: flex; flex-wrap: wrap; gap: 3px; }
  .strip-block { width: 15px; height: 15px; border-radius: 3px; cursor: pointer; flex-shrink: 0; transition: transform .1s; }
  .strip-block:hover { transform: scale(1.35); }

  .kpi-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px; margin-bottom: 20px;
  }
  .kpi { background: #0f2240; border: 1px solid #1e4a7a; border-radius: 12px; padding: 16px 18px; }
  .kpi-label { font-size: 11px; color: #7aa3cc; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .kpi-value { font-size: 26px; font-weight: 700; }
  .kpi-value.blue { color: #4da3e8; }
  .kpi-value.green { color: #4caf82; }
  .kpi-value.amber { color: #f0a030; }
  .kpi-value.red { color: #e05a5a; }
  .kpi-value.gray { color: #7aa3cc; }

  .progress-bar { height: 6px; background: #0a1628; border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .progress-bar i { display: block; height: 100%; background: #4caf82; transition: width 0.3s; }

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; align-items: center; }
  input[type="text"], select, textarea {
    background: #0f2240; border: 1px solid #1e4a7a; color: #e0e6f0;
    padding: 8px 12px; border-radius: 8px; font-size: 13px; font-family: inherit;
  }
  input[type="text"]:focus, select:focus, textarea:focus { outline: none; border-color: #3a8fd4; }
  #search { min-width: 220px; flex: 1; }

  .btn {
    background: #1e5fa8; color: #fff; border: none;
    padding: 9px 16px; border-radius: 8px; font-size: 13px;
    cursor: pointer; font-weight: 600; transition: background 0.2s;
  }
  .btn:hover { background: #2673c2; }
  .btn.ghost { background: transparent; border: 1px solid #1e4a7a; color: #7aa3cc; }
  .btn.ghost:hover { border-color: #3a8fd4; color: #e0e6f0; }

  .panel {
    background: #0f2240; border: 1px solid #1e4a7a; border-radius: 12px;
    padding: 16px 18px; margin-bottom: 20px; display: none;
  }
  .panel.open { display: block; }
  .panel h3 { font-size: 13px; color: #7aa3cc; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .panel-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .panel textarea { width: 100%; min-height: 90px; resize: vertical; }
  .panel small { color: #5a7ca0; display: block; margin-top: 4px; }

  .section-title { font-size: 14px; color: #7aa3cc; text-transform: uppercase; letter-spacing: 0.7px; margin: 22px 0 14px; font-weight: 600; }

  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .card {
    background: #0f2240; border: 1px solid #1e4a7a; border-radius: 14px;
    padding: 14px 16px; position: relative; border-left: 5px solid #3a5a7a;
    transition: border-color 0.2s, outline .2s;
  }
  .card.st-pendente { border-left-color: #5a6a80; }
  .card.st-liberado { border-left-color: #1e5fa8; }
  .card.st-aprovado { border-left-color: #2a7a5a; }
  .card.st-reprovado { border-left-color: #a83a3a; }
  .card.flash { outline: 2px solid #4da3e8; }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .card-id { font-family: 'Courier New', monospace; font-size: 14px; font-weight: 700; color: #fff; word-break: break-all; }
  .card-meta { font-size: 11px; color: #7aa3cc; margin-top: 2px; }
  .card-del { background: none; border: none; color: #4a5a70; cursor: pointer; font-size: 14px; padding: 2px 4px; }
  .card-del:hover { color: #e05a5a; }

  .status-pill {
    display: block; width: 100%; text-align: center;
    padding: 7px 0; border-radius: 20px; font-size: 12px; font-weight: 700;
    border: none; cursor: pointer; margin: 10px 0; letter-spacing: 0.3px;
  }
  .status-pill.st-pendente { background: #1a2233; color: #7aa3cc; }
  .status-pill.st-liberado { background: #0a1f3a; color: #4da3e8; }
  .status-pill.st-aprovado { background: #0d3320; color: #4caf82; }
  .status-pill.st-reprovado { background: #2a0d0d; color: #e05a5a; }

  .card-field { margin-bottom: 8px; }
  .card-field label { display: block; font-size: 10px; color: #5a7ca0; text-transform: uppercase; margin-bottom: 3px; }
  .card-field input, .card-field textarea { width: 100%; padding: 6px 8px; font-size: 12px; background: #0a1628; }
  .card-field textarea { min-height: 44px; resize: vertical; }

  .empty-state { text-align: center; padding: 48px; color: #7aa3cc; grid-column: 1 / -1; }

  footer { text-align: center; padding: 24px; color: #3a5a7a; font-size: 12px; border-top: 1px solid #1e4a7a; margin-top: 30px; }

  @media print {
    header, .toolbar, .panel, .card-del, footer, .btn { display: none !important; }
    body { background: #fff; color: #000; }
    .card, .doc-card, .kpi, .map-panel { border-color: #999 !important; background: #fff !important; }
    .card-id, .card-meta, .kpi-value, .doc-card span.v { color: #000 !important; }
    .cards-grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🪪</div>
    <div class="logo-text">
      <h1 id="page-title">Cartão de Campo</h1>
      <p>Controle de Desenhos · Tubulação — Milplan Engenharia</p>
    </div>
  </div>
  <div class="nav-links">
    <a class="nav-link" href="linhas.html">☰ Todas as linhas</a>
    <a class="nav-link" href="index.html">← Portal de Inspeção</a>
  </div>
</header>

<div class="wrap" id="app"></div>

<footer id="page-footer"></footer>

<script>
const params = new URLSearchParams(window.location.search);
const docId = params.get('doc');

seedExampleLine();

let linha = docId ? getLinha(docId) : null;

if (linha) { renderApp(); } else { renderEmptyState(); }

function renderEmptyState() {
  const linhas = loadLinhas();
  document.getElementById('app').innerHTML = `
    <div class="empty-state" style="padding-top:60px">
      <p style="font-size:16px;color:#e0e6f0;margin-bottom:14px">${docId ? 'Linha "' + docId + '" não encontrada.' : 'Nenhuma linha selecionada.'}</p>
      ${linhas.length ? `
        <p style="margin-bottom:14px">Escolha uma linha cadastrada:</p>
        <select id="jump" style="background:#0f2240;border:1px solid #1e4a7a;color:#e0e6f0;padding:8px 14px;border-radius:8px">
          <option value="">Selecione...</option>
          ${linhas.map(l => `<option value="${l.id}">${l.id}${l.isometrico ? ' — ' + l.isometrico : ''}</option>`).join('')}
        </select>
      ` : '<p>Cadastre a primeira linha no painel geral.</p>'}
      <p style="margin-top:18px"><a class="nav-link" href="linhas.html">☰ Ir para o painel de linhas</a></p>
    </div>`;
  const jump = document.getElementById('jump');
  if (jump) jump.addEventListener('change', e => {
    if (e.target.value) window.location.href = 'cartao-campo.html?doc=' + encodeURIComponent(e.target.value);
  });
}

function renderApp() {
document.getElementById('page-title').textContent = 'Cartão de Campo — ' + (linha.isometrico || linha.id);
document.getElementById('page-footer').innerHTML =
  `Cartão de Campo · Portal de Inspeção de Qualidade · Milplan Engenharia<br>
   Linha ${linha.id}${linha.revisao ? ' Rev.' + linha.revisao : ''} — confira a lista de spools contra a lista oficial de materiais antes do uso em campo. Dados salvos apenas neste navegador.`;

document.getElementById('app').innerHTML = `
  <div class="doc-card">
    <div><span class="l">Documento</span><span class="v mono">${linha.id}</span></div>
    <div><span class="l">Revisão</span><span class="v">${linha.revisao || '—'}</span></div>
    <div><span class="l">Isométrico</span><span class="v mono">${linha.isometrico || '—'}</span></div>
    <div><span class="l">Título / Projeto</span><span class="v">${linha.titulo || '—'}</span></div>
    <div><span class="l">CWA</span><span class="v">${linha.cwa || '—'}</span></div>
    <div><span class="l">Folhas</span><span class="v">${linha.folhas || '—'}</span></div>
  </div>

  ${linha.holdNota ? `<div class="hold-banner"><span>⚠️</span><div><b>Atenção:</b> ${linha.holdNota}</div></div>` : ''}

  <div class="map-panel">
    <div class="map-title">Mapa visual da linha (1 bloco = 1 spool, na ordem do isométrico)</div>
    <div class="legend">
      <span><i style="background:${STATUS_COLOR.pendente}"></i> Pendente</span>
      <span><i style="background:${STATUS_COLOR.liberado}"></i> Liberado</span>
      <span><i style="background:${STATUS_COLOR.aprovado}"></i> Aprovado</span>
      <span><i style="background:${STATUS_COLOR.reprovado}"></i> Reprovado</span>
    </div>
    <div class="strip" id="line-map"></div>
  </div>

  <div class="kpi-row">
    <div class="kpi"><div class="kpi-label">Total de Spools</div><div class="kpi-value blue" id="kpi-total">0</div></div>
    <div class="kpi"><div class="kpi-label">✅ Aprovados</div><div class="kpi-value green" id="kpi-aprovado">0</div></div>
    <div class="kpi"><div class="kpi-label">🔄 Liberados</div><div class="kpi-value blue" id="kpi-liberado">0</div></div>
    <div class="kpi"><div class="kpi-label">⏳ Pendentes</div><div class="kpi-value gray" id="kpi-pendente">0</div></div>
    <div class="kpi"><div class="kpi-label">❌ Reprovados</div><div class="kpi-value red" id="kpi-reprovado">0</div></div>
    <div class="kpi">
      <div class="kpi-label">Progresso</div>
      <div class="kpi-value green" id="kpi-pct">0%</div>
      <div class="progress-bar"><i id="progress-fill" style="width:0%"></i></div>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="🔍 Buscar spool...">
    <select id="filter-folha"><option value="">📄 Todas as folhas</option></select>
    <select id="filter-status">
      <option value="">📋 Todos os status</option>
      <option value="pendente">⏳ Pendente</option>
      <option value="liberado">🔄 Liberado</option>
      <option value="aprovado">✅ Aprovado</option>
      <option value="reprovado">❌ Reprovado</option>
    </select>
    <button class="btn ghost" onclick="togglePanel('panel-add')">➕ Adicionar spool</button>
    <button class="btn ghost" onclick="togglePanel('panel-import')">📋 Importar lista</button>
    <button class="btn ghost" onclick="exportCSV()">⬇️ Exportar CSV</button>
    <button class="btn ghost" onclick="window.print()">🖨️ Imprimir</button>
  </div>

  <div class="panel" id="panel-add">
    <h3>Adicionar spool manualmente</h3>
    <div class="panel-row">
      <input type="text" id="add-id" placeholder="Nº do spool (ex: SP-0416-00062-059)">
      <input type="text" id="add-folha" placeholder="Folha (ex: 6/6)" style="max-width:120px">
      <input type="text" id="add-dn" placeholder="DN (ex: 22&quot;)" style="max-width:100px">
      <button class="btn" onclick="addSpool()">Adicionar</button>
    </div>
  </div>

  <div class="panel" id="panel-import">
    <h3>Importar lista (colar do Excel/lista de materiais)</h3>
    <div class="panel-row"><textarea id="import-text" placeholder="Uma linha por spool: ID;Folha;DN&#10;Ex: SP-0416-00062-059;6/6;22&quot;"></textarea></div>
    <div class="panel-row">
      <button class="btn" onclick="importSpools()">Importar</button>
      <small>Formato: <code>ID;Folha;DN</code> — Folha e DN são opcionais.</small>
    </div>
  </div>

  <div class="section-title">Spools do isométrico</div>
  <div class="cards-grid" id="cards-grid"></div>
`;

document.getElementById('line-map').addEventListener('click', e => {
  const b = e.target.closest('.strip-block');
  if (!b) return;
  const card = document.getElementById('card-' + CSS.escape(b.dataset.id));
  if (!card) return;
  card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  card.classList.add('flash');
  setTimeout(() => card.classList.remove('flash'), 1200);
});

document.getElementById('search').addEventListener('input', render);
document.getElementById('filter-folha').addEventListener('change', render);
document.getElementById('filter-status').addEventListener('change', render);

buildFilters();
render();
}

function persist() { upsertLinha(linha); }

function togglePanel(id) { document.getElementById(id).classList.toggle('open'); }

function addSpool() {
  const id = document.getElementById('add-id').value.trim();
  if (!id) return;
  const folha = document.getElementById('add-folha').value.trim();
  const dn = document.getElementById('add-dn').value.trim();
  linha.spools.push({ id, folha, dn, status: 'pendente', inspetor: '', obs: '', updatedAt: '' });
  document.getElementById('add-id').value = '';
  document.getElementById('add-folha').value = '';
  document.getElementById('add-dn').value = '';
  persist(); buildFilters(); render();
}

function importSpools() {
  const text = document.getElementById('import-text').value;
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  let added = 0;
  lines.forEach(line => {
    const [id, folha, dn] = line.split(';').map(s => (s||'').trim());
    if (!id) return;
    if (linha.spools.some(s => s.id === id)) return;
    linha.spools.push({ id, folha: folha||'', dn: dn||'', status: 'pendente', inspetor: '', obs: '', updatedAt: '' });
    added++;
  });
  document.getElementById('import-text').value = '';
  persist(); buildFilters(); render();
  alert(`${added} spool(s) importado(s).`);
}

function removeSpool(id) {
  if (!confirm(`Remover ${id} da lista?`)) return;
  linha.spools = linha.spools.filter(s => s.id !== id);
  persist(); buildFilters(); render();
}

function cycleStatus(id) {
  const s = linha.spools.find(s => s.id === id);
  if (!s) return;
  const idx = STATUS_CYCLE.indexOf(s.status);
  s.status = STATUS_CYCLE[(idx + 1) % STATUS_CYCLE.length];
  s.updatedAt = new Date().toISOString().split('T')[0];
  persist(); render();
}

function updateField(id, field, value) {
  const s = linha.spools.find(s => s.id === id);
  if (!s) return;
  s[field] = value;
  if (field !== 'obs') s.updatedAt = new Date().toISOString().split('T')[0];
  persist(); updateKPIs();
}

function buildFilters() {
  const folhas = [...new Set(linha.spools.map(s => s.folha).filter(Boolean))].sort();
  const sel = document.getElementById('filter-folha');
  const current = sel.value;
  sel.innerHTML = '<option value="">📄 Todas as folhas</option>';
  folhas.forEach(f => sel.innerHTML += `<option value="${f}">Folha ${f}</option>`);
  sel.value = current;
}

function updateKPIs() {
  const st = lineStats(linha);
  document.getElementById('kpi-total').textContent = st.total;
  document.getElementById('kpi-aprovado').textContent = st.aprovado;
  document.getElementById('kpi-liberado').textContent = st.liberado;
  document.getElementById('kpi-pendente').textContent = st.pendente;
  document.getElementById('kpi-reprovado').textContent = st.reprovado;
  document.getElementById('kpi-pct').textContent = st.pct + '%';
  document.getElementById('progress-fill').style.width = st.pct + '%';
}

function renderMap() {
  const map = document.getElementById('line-map');
  if (!linha.spools.length) { map.innerHTML = '<span style="font-size:12px;color:#5a7ca0">Nenhum spool importado ainda.</span>'; return; }
  map.innerHTML = linha.spools.map(s =>
    `<span class="strip-block" style="background:${STATUS_COLOR[s.status]}" title="${s.id} — ${STATUS_LABEL[s.status]}" data-id="${s.id}"></span>`
  ).join('');
}

function render() {
  updateKPIs();
  renderMap();
  const search = document.getElementById('search').value.toLowerCase();
  const fFolha = document.getElementById('filter-folha').value;
  const fStatus = document.getElementById('filter-status').value;

  const filtered = linha.spools.filter(s => {
    if (search && !s.id.toLowerCase().includes(search)) return false;
    if (fFolha && s.folha !== fFolha) return false;
    if (fStatus && s.status !== fStatus) return false;
    return true;
  });

  const grid = document.getElementById('cards-grid');
  if (!filtered.length) {
    grid.innerHTML = '<div class="empty-state">Nenhum spool encontrado. Use "Adicionar spool" ou "Importar lista" acima.</div>';
    return;
  }

  grid.innerHTML = filtered.map(s => `
    <div class="card st-${s.status}" id="card-${CSS.escape(s.id)}">
      <div class="card-top">
        <div>
          <div class="card-id">${s.id}</div>
          <div class="card-meta">${s.folha ? 'Folha ' + s.folha : ''}${s.dn ? ' · DN ' + s.dn : ''}</div>
        </div>
        <button class="card-del" onclick="removeSpool('${s.id}')" title="Remover">✕</button>
      </div>
      <button class="status-pill st-${s.status}" onclick="cycleStatus('${s.id}')">${STATUS_LABEL[s.status]}</button>
      <div class="card-field">
        <label>Inspetor</label>
        <input type="text" value="${s.inspetor}" placeholder="Rubrica / nome" onchange="updateField('${s.id}','inspetor',this.value)">
      </div>
      <div class="card-field">
        <label>Observação</label>
        <textarea placeholder="Ex: aguardando END, junta 4 reprovada..." onchange="updateField('${s.id}','obs',this.value)">${s.obs}</textarea>
      </div>
      ${s.updatedAt ? `<div class="card-meta">Atualizado: ${s.updatedAt}</div>` : ''}
    </div>
  `).join('');
}

function exportCSV() {
  const header = 'ID;Folha;DN;Status;Inspetor;Observacao;Atualizado\n';
  const rows = linha.spools.map(s => [s.id, s.folha, s.dn, STATUS_LABEL[s.status], s.inspetor, s.obs, s.updatedAt]
    .map(v => `"${(v||'').toString().replace(/"/g,'""')}"`).join(';')).join('\n');
  const blob = new Blob(['﻿' + header + rows], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `cartao-campo-${linha.id}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

</script>
</body>
</html>
